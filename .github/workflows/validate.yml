name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate plugin manifests
        run: |
          jq empty .claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json
      - name: Python syntax check
        run: python3 -m py_compile lib/*.py
      - name: Claude plugin validation
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # the emitted opencode plugin is exercised under node
        with:
          node-version: 22
      - name: Adapter render tests
        # Golden-render harness for tracker adapters (docs/ADAPTERS.md §"Adapter
        # doctor self-tests"). Catches comment-blind read paths and unresolved
        # placeholders. See tests/test_adapter_render.py.
        run: uv run --with pytest --with pyyaml pytest tests/ -q
      - name: Org-name gate
        # forge is org-generic (CONTRIBUTING.md "forge stays org-generic"). The forbidden
        # names are a repository SECRET, never committed (committing them would name the
        # org) and never a variable (forge is public; a variable's value shows in CI
        # logs). Nothing here prints the value. Fork PRs get no secrets, so there it is
        # empty and the gate skips with a warning.
        env:
          FORGE_FORBIDDEN_NAMES: ${{ secrets.FORGE_FORBIDDEN_NAMES }}
        run: |
          if [ -z "$FORGE_FORBIDDEN_NAMES" ]; then
            echo "::warning::FORGE_FORBIDDEN_NAMES is unset; the org-name gate is skipped"
          fi
          uv run --with pytest pytest tests/test_forbidden_names.py -q -rs
