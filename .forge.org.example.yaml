# .forge.org.yaml — the ORG TIER config (captured once by /forge:emit's interview).
#
# This is the org's answers to the generator interview. /forge:emit reads it and
# emits a standalone, ORG-OWNED Claude Code plugin (the org's agent harness).
#
# Two hard rules this file exists to enforce:
#   1. The emitted package is ORG-OWNED. Nothing here — and nothing emitted from
#      here — may carry the generator's identity (no "forge", no maintainer name,
#      no upstream repo URL). Every identity field below is the ORG's.
#   2. The harness is NEUTRAL. It does not hardcode the org's process; it READS
#      the operating model from the org wiki at runtime. So this file points AT
#      the wiki — it does not restate the wiki's contents.
#
# This example uses a fictional "Acme". Your real file carries your org.

org:
  name: Acme                              # appears in attribution markers: [acme/implementer]
  slug: acme                              # lowercase id used in identifiers

# --- Verbs: name your harness's commands (a creative step of building YOUR product). ---
# The generator ships canonical verb names; you may rename ANY of them here. Whatever
# you choose becomes the invocable command (/<plugin>:<verb>) and the emitted skill dir.
# Omit a verb to keep its canonical default. Canonical set:
#   intro · setup · prime · inception · refine · execute · gate · wiki · handoff
# (intro/setup/prime/refine/wiki/handoff are descriptive enough that most orgs keep them;
# inception/execute/gate are the ones orgs most often theme.) Example below renames none;
# an org with a flavor might do: inception: discover, execute: ship, gate: review.
verbs: {}

# --- Emitted plugin identity (THE leak surface — all org-owned, zero generator) ---
plugin:
  name: acme-harness                      # the emitted plugin's name; commands namespace as /acme-harness:<verb>
  version: 0.1.0                          # the ORG's version of THEIR package (not the generator's)
  description: "Acme's agent harness — refine tickets to agent-ready, execute via scoped agents, gate pre-merge. Reads the Acme operating model at runtime."
  author:
    name: Acme Platform Engineering       # NOT the generator maintainer
    url: https://github.com/acme           # the ORG's git host
  homepage: https://github.com/acme/acme-harness   # where the org distributes it internally
  license: UNLICENSED                     # org packages are typically private

# --- The org brain (already exists, or seeded once). The harness READS this. ---
# If `exists: true`, /forge:emit points the harness at it and does NOT stamp a wiki
# (never clobber a live org brain). If false, emit seeds the org-wiki skeleton.
org_wiki:
  exists: true
  name: acme-wiki
  remote: git@github.com:acme/acme-wiki.git
  # How the harness locates a local checkout at runtime (env override wins):
  local_path_env: ACME_WIKI
  default_local_path: ~/work/acme-wiki
  # Pages the harness reads at prime (the neutral→process binding). Paths are
  # the org's; the harness reads whatever is here, so process can change without
  # a harness release.
  prime_reads:
    - operating-model.md     # the refine→execute→gate flow the harness orchestrates
    - CLAUDE.md              # wiki schema + hard rules
    - compliance.md          # regulated guardrails (if present)
    - decisions/             # ADRs — read those relevant to the work

# --- Tracker: the coordination bus. Adapter-shaped (see forge/adapters/tracker/). ---
# `type` selects the tracker adapter. Valid Jira options today:
#   jira-mcp   — Jira Cloud over the Atlassian MCP server (needs cloud_id).
#   jira-acli  — Jira Cloud over Atlassian's official `acli` CLI (no MCP, no cloud_id;
#                acli holds its own auth context — run `acli jira auth login --web`).
# The two share project_key + base_url; only jira-mcp also takes a cloud_id.
tracker:
  type: jira-mcp                          # jira-mcp | jira-acli | github | gitlab | linear | asana
  config:
    cloud_id: "00000000-0000-0000-0000-000000000000"   # jira-mcp only; omit for jira-acli
    project_key: ACME
    base_url: https://acme.atlassian.net
  # jira-acli alternative (no cloud_id — acli resolves the site from its auth context):
  #   type: jira-acli
  #   config:
  #     project_key: ACME
  #     base_url: https://acme.atlassian.net

# --- SCM: where code + PRs live. ---
scm:
  type: github                            # github | gitlab | bitbucket
  org: acme

# --- Model policy: YOUR org's model floor for ALL agent work (optional). ---
# This is the floor for the build graph-agent AND the optional supplementary reviewer —
# on opencode, a model that is off-provider or on this banned list refuses to emit
# (definition-time, fail-closed). It is OPTIONAL: omit this whole block and the harness
# simply surfaces a neutral "set model explicitly" rule in the emitted prose. Set
# it to encode YOUR floor — e.g. ban a model whose output on reasoning-heavy work gets
# redone (wasting tokens regardless of unit price; optimize for value-per-token, not
# cheapest token). The rendered skills surface these to the orchestrator at dispatch time.
model_policy:
  banned: [haiku]            # models no stage may use (illustrative; tune to your org)
  default: sonnet            # the floor for reasoning-heavy work (the guard, not a pin)
  rule: "Always set model explicitly on ad-hoc agent() calls; never leave it implicit."

# --- The graph-agent (ADR 0018 + ADR 0017). ---
# The harness is ONE persistent `build` graph-agent that traverses the build graph
# (understand→build→validate→review→fix→clear) in a SINGLE context — NOT a cast of role
# agents. `model` + `effort` are OPTIONAL and default to INHERIT (ADR 0017): omit them and
# the agent inherits the orchestration session's model/effort, or a per-run launch/dispatch
# value picks them. Set them ONLY to PIN this one agent's depth (low|medium|high|xhigh|max).
# `model_policy` above still guards any explicit pin (and the org floor, opencode.model).
# On Claude Code an unset model renders `model: inherit` in agents/build.md and drops the
# effort line; on opencode the build agent runs at the org floor (opencode.model, below).
agents:
  - name: build
    description: "The single graph-agent: traverses the build graph in one context, opens a PR. Never merges."
    # model: sonnet     # OPTIONAL — omit to inherit the session; set to pin this agent's depth
    # effort: high      # OPTIONAL — omit to inherit the session effort

# --- The intra-task graph (ADR 0018): the STATES one `build` agent traverses. ---
# SHARED and target-neutral — both the Claude Code and opencode targets bind THIS graph.
# The agent walks the nodes by changing skill/rubric/effort per node; `review` is a
# SELF-CHECK node of that one agent (it re-reads its own diff adversarially), never a
# separately-spawned validator. The relied-upon independent review is the human merge
# gate + CI. BOTH loop caps are REQUIRED — their absence is fail-open and refuses to emit.
graph:
  agent: build
  entry: understand
  max_total_steps: 400        # HARD total-step cap (fail-closed; presence REQUIRED)
  max_fix_loops: 3            # review→fix bound (presence REQUIRED)
  # A node carries a skill|rubric and its transitions (next|terminal). `effort` is
  # OPTIONAL (ADR 0017): omit it and the node inherits the session effort (or a per-run
  # launch value); add `effort: <low|medium|high|xhigh|max>` to a node only to pin it.
  nodes:
    understand: { skill: execute, next: build }
    build:      { skill: execute, next: validate }   # TDD: failing test first
    validate:   { skill: execute, next: review }
    review:     { rubric: review, mode: self_check, next: [clear, fix] }
    fix:        { skill: execute, next: validate }
    clear:      { rubric: gate,   terminal: pr_open }
  # The ONLY surviving fresh-context validator (ADR 0018 §5): an OPTIONAL reviewer that
  # runs on a COMPLETED PR for a high-risk diff, never inside the build loop. When
  # enabled, the opencode target emits it as agent/validate.md (read-only). `max_steps` is
  # REQUIRED (a fail-closed cap); `model` is OPTIONAL. Disable it and none of that is emitted.
  supplementary_reviewer:
    enabled: true
    fresh_context: true
    read_surface: [read, grep, glob]
    max_steps: 40
    # model:            # OPTIONAL — omit to inherit the orchestration model (opencode.model).
                        # Set to PIN it (validated on-provider + off-banned at emit), e.g.:
    # model: amazon-bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0

# --- Operating-model POINTERS (not the model itself — that lives in the wiki). ---
# These tell the harness *where* its behavior is governed, and surface the two
# org-declared facets the generator must not assume.
operating_model:
  source: org_wiki:operating-model.md     # single source of truth; harness reads it
  # Facets the generator refuses to default (GENERATOR.md "decisions locked"):
  cross_project_truth_adjudicator: null   # who arbitrates contradictory learnings; null => default-deny promotion
  capture_default: trigger-gated          # trigger-gated | always-on
  # Platform backstops for no-self-review are an org choice, layered on top of
  # context isolation (which is always enforced structurally):
  platform_backstops:
    - branch-protection
    - required-reviews

# --- opencode target (only read by `emit --target opencode`). ---
# EVERYTHING ABOVE IS SHARED — one org config, N hosts. This block adds ONLY what the
# opencode host needs that Claude Code doesn't: how to reach the model provider, and the
# host-native primary-agent name. The verbs, the wiki pointers, the model policy, the
# graph and the graph-agent's depth are NOT restated here — there is no role cast to
# declare (ADR 0018): the build graph-agent is one agent, and the optional supplementary
# reviewer is declared once under `graph.supplementary_reviewer` above.
# The emitted configuration is BACK/FORWARD COMPATIBLE: one artifact runs unchanged on
# opencode 1.18.29+ and 2.x (the emitted plugins carry both entrypoints). `emit` checks
# the installed opencode and refuses hosts older than 1.18.29.
opencode:
  provider:
    id: amazon-bedrock                    # the ONLY provider, by opencode id (amazon-bedrock,
                                          # anthropic, opencode-go, ...). Emitted as an
                                          # "enabled_providers" ALLOWLIST. Auth and provider
                                          # options (region, profile, base URL) are opencode's
                                          # business, never this file's.
  model:
    provider: amazon-bedrock
    model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  primary_agent: build                    # the long-lived orchestrator the verbs run as, AND the
                                          # build graph-agent dispatch launches per task
  disabled_providers: ["opencode"]         # belt-and-suspenders: names the built-in provider too.
                                          # The allowlist above is the load-bearing control.
  # Which shared skills to fold into skill/. `gate` is a rubric, not a verb, so it is absent.
  skills: [intro, setup, prime, inception, refine, execute, wiki, handoff]

# --- Chat / notifications (optional, adapter-shaped). ---
integrations:
  # - type: chat
  #   name: slack
  #   config: { workspace: acme, channels: { blockers: agent-blockers } }
